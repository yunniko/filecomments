[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "filecomments"
version = "0.1.0"
description = "Comment any file or directory; visualize with cls"
requires-python = ">=3.10"

[project.scripts]
cmt = "filecomments.cli:main"
cls = "filecomments.cls:main"
